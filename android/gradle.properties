# Heap sized for a 7 GB machine — 4 GB leaves room for the OS, IDE
# and other apps. Earlier value (8 GB) exceeded physical RAM and
# crashed the Gradle daemon mid-build with a G1 mmap failure. Bump
# these back up if you move to a beefier machine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
